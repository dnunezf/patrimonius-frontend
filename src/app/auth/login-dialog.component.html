<div class="modal" *ngIf="open">
  <div class="dialog">
    <button class="dialog__close" (click)="close()">×</button>

    <!-- Paso 1 -->
    <h2 *ngIf="step() === 1">Iniciar Sesión</h2>

    <!-- Mensaje de éxito -->
    <div *ngIf="success()" class="success">✔ {{ success() }}</div>

    <form
      *ngIf="step() === 1 && !success()"
      [formGroup]="formLogin"
      (ngSubmit)="submitLogin()"
    >
      <label>Email</label>
      <input
        type="email"
        formControlName="email"
        placeholder="example@museocostarica.go.cr"
        autocomplete="username"
        [attr.maxlength]="maxEmailLength"
      />
      <p *ngIf="(formLogin.get('email')?.value?.length ?? 0) === maxEmailLength" class="limit-hint">
        Se ha alcanzado el máximo de {{ maxEmailLength }} caracteres para el correo.
      </p>

      <label>Contraseña</label>
      <div class="input-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [attr.maxlength]="maxPasswordLength"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="showPassword = !showPassword"
        >
          {{ showPassword ? "Ocultar" : "Ver" }}
        </button>
      </div>
      <p *ngIf="(formLogin.get('password')?.value?.length ?? 0) === maxPasswordLength" class="limit-hint">
        Se ha alcanzado el máximo de {{ maxPasswordLength }} caracteres para la contraseña.
      </p>

      <button type="submit" class="btn btn--primary">Entrar</button>

      <button
        type="button"
        class="btn--link"
        style="margin-top: 4px"
        (click)="goToResetPassword()"
      >
        ¿Olvidó su contraseña?
      </button>
    </form>

    <!-- Paso 2 -->
    <h2 *ngIf="step() === 2">Verificación 2FA</h2>
    <form
      *ngIf="step() === 2 && !success()"
      [formGroup]="formCode"
      (ngSubmit)="submitCode()"
    >
      <p>Ingrese el código enviado a su correo.</p>
      <div class="input-wrapper">
        <input
          [type]="showCode ? 'text' : 'password'"
          maxlength="6"
          formControlName="code"
          placeholder="000000"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="showCode = !showCode"
        >
          {{ showCode ? "Ocultar" : "Ver" }}
        </button>
      </div>
      <button type="submit" class="btn btn--primary">Verificar</button>

      <!-- reenviar código -->
      <button type="button" class="btn--link" (click)="resendCode()">
        Reenviar código
      </button>
    </form>

    <div *ngIf="error() && !success()" class="error">
      {{ error() }}
    </div>

    <div *ngIf="warning() && !success()" class="warning">
      {{ warning() }}
    </div>

    <button
      *ngIf="warning() && step() === 1 && !success()"
      type="button"
      class="btn--link"
      (click)="goToResetPassword()"
    >
      Cambiar contrasena ahora
    </button>
  </div>
</div>
