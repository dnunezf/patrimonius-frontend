<div class="reset-container">
  <h2>Restablecer contraseña</h2>
  <p class="intro">
    Ingrese su correo electrónico registrado. Si la cuenta existe en el Sistema
    Patrimonius, se enviará un enlace para restablecer su contraseña.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="email">Correo electrónico</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="example@museocostarica.go.cr"
      autocomplete="email"
    />

    <div *ngIf="submitted && form.invalid && !message" class="error">
      Por favor ingrese una dirección de correo válida.
    </div>

    <button type="submit" class="btn btn--primary">
      Enviar enlace de restablecimiento
    </button>
  </form>

  <div *ngIf="message" class="success">
    {{ message }}
  </div>
  <div *ngIf="error && !message" class="error">
    {{ error }}
  </div>
</div>
