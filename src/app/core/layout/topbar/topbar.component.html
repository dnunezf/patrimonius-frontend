<header class="topbar">
  <div class="container topbar__inner">
    <div class="brand">
      <img
        src="assets/logos/logo.png"
        alt="Logo Museo Nacional de Costa Rica"
        class="brand__logo"
      />
      <div class="brand__text">
        <strong>Patrimonius</strong>
        <span class="brand__sub">Museo Nacional de Costa Rica</span>
      </div>
    </div>

    <nav class="nav">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__btn"
      >Dashboard</a
      >

      <a
        routerLink="/admin/notifications"
        routerLinkActive="active"
        class="nav__btn nav__btn--notif"
      >
        Notificaciones
        <span class="nav__badge" *ngIf="noticeCount() > 0">{{
            noticeCount()
          }}</span>
      </a>
    </nav>

    <div class="session">
      <span class="role">admin@gmail.com</span>
      <span class="role-sub">Administrador</span>
      <button class="btn-exit" (click)="signOut()">Salir</button>
    </div>
  </div>
</header>
