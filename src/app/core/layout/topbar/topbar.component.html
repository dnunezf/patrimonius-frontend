<header class="topbar">
  <div class="container topbar__inner">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true">
        <circle cx="7" cy="7" r="7" fill="var(--mncr-red-1795)"></circle>
      </svg>
      <strong>Patrimonius</strong>
    </div>

    <nav class="nav">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__btn"
        >Dashboard</a
      >

      <a
        routerLink="/admin/notifications"
        routerLinkActive="active"
        class="nav__btn nav__btn--notif"
      >
        Notificaciones
        <span class="nav__badge" *ngIf="noticeCount() > 0">{{
          noticeCount()
        }}</span>
      </a>
    </nav>

    <div class="session">
      <span class="role">admin@gmail.com</span>
      <span class="role-sub">Administrador</span>
      <button class="btn-exit" (click)="signOut()">Salir</button>
    </div>
  </div>
</header>
