<header class="topbar" role="banner">
  <!-- Left -->
  <div class="topbar__left">
    <!-- ☰ SOLO si está logueado -->
    <button *ngIf="isLoggedIn()"
            class="iconbtn iconbtn--primary"
            type="button"
            (click)="openDrawer()"
            aria-label="Abrir Roles y Permisos">
      ☰
    </button>

    <a class="brand" [routerLink]="'/'" aria-label="Ir a inicio">
      <img class="brand__logo" [src]="logo" alt="Museo Nacional - Logotipo" />
      <span class="brand__text">
        <strong>{{ brandTitle }}</strong>
        <small>{{ brandSubtitle }}</small>
      </span>
    </a>
  </div>

  <!-- Right -->
  <div class="topbar__right">
    <!-- Si NO está logueado: botón iniciar sesión -->
    <button *ngIf="!isLoggedIn() && loginItem"
            class="btn-logout"
            type="button"
            (click)="loginClick.emit()">
      Iniciar sesión
    </button>

    <!-- Si SÍ está logueado -->
    <ng-container *ngIf="isLoggedIn()">
      <button class="iconbtn"
              type="button"
              [routerLink]="notificationsLink()"
              aria-label="Notificaciones">
        🔔
        <span *ngIf="noticeCount() > 0" class="badge">{{ badgeText() }}</span>
      </button>

      <span class="email">{{ userEmail() }}</span>

      <button class="btn-logout" type="button" (click)="signOut()">
        Salir
      </button>
    </ng-container>
  </div>
</header>

<!-- Overlay y Drawer SOLO si está logueado -->
<div *ngIf="isLoggedIn()"
     class="overlay"
     [class.is-open]="drawerOpen()"
     (click)="closeDrawer()"></div>

<aside *ngIf="isLoggedIn()"
       class="drawer"
       [class.is-open]="drawerOpen()"
       role="dialog"
       aria-label="Menú">
  <div class="drawer__top">
    <button class="closebtn" type="button" (click)="closeDrawer()" aria-label="Cerrar">
      ✕
    </button>

    <div class="drawer__brand">
      <div class="drawer__title">Patrimonius</div>
      <div class="drawer__subtitle">Museo Nacional</div>
    </div>
  </div>

  <div class="drawer__section">ROLES</div>

  <nav class="drawer__nav">
    <a *ngFor="let r of rolesList"
       class="drawer__item"
       [routerLink]="roleLink(r)"
       routerLinkActive="is-active"
       (click)="closeDrawer()">
      <img class="drawer__icon" [src]="roleIcon(r)" alt="" aria-hidden="true" />
      <span class="drawer__label">{{ r }}</span>
      <span class="drawer__chev">›</span>
    </a>
  </nav>
</aside>
