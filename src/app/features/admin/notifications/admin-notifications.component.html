<main class="container">
  <h1 class="mb-8">Notificaciones del Sistema</h1>
  <p class="mb-16" style="color:#6b7280">
    Alertas y eventos importantes que requieren atención administrativa
  </p>

  <section class="notice-list">
    <article class="card notice"
             *ngFor="let n of notices; let i = index"
             [class.level-high]="n.level==='high'"
             [class.level-medium]="n.level==='medium'"
             [class.level-low]="n.level==='low'">
      <div class="notice__rail"></div>

      <div class="notice__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2 2 22h20L12 2z"></path>
        </svg>
      </div>

      <div class="notice__body">
        <div class="notice__head">
          <strong class="notice__title">{{ n.title }}</strong>
          <div class="notice__chips">
            <span class="tag"
                  [ngClass]="{'tag--low': n.level==='low', 'tag--medium': n.level==='medium', 'tag--high': n.level==='high'}">
              {{ n.level | titlecase }}
            </span>
            <span class="tag tag--new" *ngIf="n.fresh">Nueva</span>
            <button class="btn-ghost" (click)="markRead(i)">Marcar como leída</button>
            <button class="btn-ghost">Ver en Bitácora</button>
          </div>
        </div>

        <p class="notice__text">{{ n.body }}</p>
        <div class="notice__time">🗓 {{ n.time }}</div>
      </div>
    </article>
  </section>
</main>
