<main class="container">
  <!-- 🔙 Enlace de regreso al panel -->
  <div class="back-container">
    <a routerLink="/admin/dashboard" class="back-link">
      ← Volver al Panel de Administración
    </a>
  </div>

  <section class="grid">
    <!-- Tarjeta por cada submódulo -->
    <article
      *ngFor="let m of submodules"
      class="card clickable-card"
      [routerLink]="m.link || '/admin/module/catalogs'"
    >
      <div class="row1">
        <!-- Icono dinámico -->
        <div class="icon-wrapper">
          <img
            [src]="'assets/icons/' + m.icon + '.png'"
            alt="{{ m.title }}"
            class="icon-img"
          />
        </div>

        <span class="badge" [class.ok]="m.status === 'available'">
          {{ m.status === 'available' ? 'Disponible' : 'En desarrollo' }}
        </span>
      </div>

      <h3 class="title">{{ m.title }}</h3>
      <p class="desc">{{ m.desc }}</p>

      <div class="features">
        <strong>Funciones principales:</strong>
        <ul>
          <li *ngFor="let b of m.bullets">{{ b }}</li>
        </ul>
      </div>
    </article>
  </section>
</main>
