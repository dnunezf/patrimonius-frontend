<main class="container">
  <section style="margin-bottom: 18px">
    <h1>Panel de Administración</h1>
    <p style="margin: 0; color: #6b7280">
      Gestione usuarios, configuraciones y supervise el sistema completo de
      Patrimonius
    </p>
  </section>


  <!-- Module cards -->
  <h2>Módulos Administrativos</h2>
  <section class="row cols-3">
    <article
      class="card"
      *ngFor="let m of moduleCards"
      [routerLink]="m.link || null"
      style="display: flex; flex-direction: column; gap: 10px; cursor: pointer"
    >
      <div class="module__head">
        <div class="module__title">
          <div class="icon-wrapper">
            <img
              [src]="'assets/icons/' + m.icon + '.png'"
              alt="{{ m.title }}"
              class="icon-img"
            />
          </div>
          <strong>{{ m.title }}</strong>
        </div>
        <span class="badge" [class.success]="m.status === 'available'">
          {{ m.status === "available" ? "Disponible" : "En desarrollo" }}
        </span>
      </div>

      <p class="module__desc">{{ m.description }}</p>

      <ul
        style="margin: 0; padding-left: 18px; color: #374151; font-size: 14px"
      >
        <li *ngFor="let f of m.features">{{ f }}</li>
      </ul>
    </article>
  </section>
</main>
