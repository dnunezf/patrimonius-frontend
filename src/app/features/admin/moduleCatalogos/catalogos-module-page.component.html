<main class="container">
  <section class="grid">
    <article *ngFor="let m of submodules" class="card clickable-card">
      <div class="row1">
        <div class="icon" aria-hidden="true"></div>
        <span class="badge" [class.ok]="m.status === 'available'">
          {{ m.status === 'available' ? 'Disponible' : 'En desarrollo' }}
        </span>
      </div>

      <h3 class="title">{{ m.title }}</h3>
      <p class="desc">{{ m.desc }}</p>

      <div class="features">
        <strong>Funciones principales:</strong>
        <ul>
          <li *ngFor="let b of m.bullets">{{ b }}</li>
        </ul>
      </div>

      <div *ngIf="m.statsValue">
        <strong>Estadísticas:</strong>
        <p>{{ m.statsValue }}</p>
      </div>

      <div class="actions">
        <a *ngFor="let link of m.links" class="btn" [routerLink]="link.route">
          {{ link.label }}
        </a>
      </div>
    </article>
  </section>
</main>
<router-outlet></router-outlet>  <!-- Esto es clave para mostrar los componentes de los catálogos -->
