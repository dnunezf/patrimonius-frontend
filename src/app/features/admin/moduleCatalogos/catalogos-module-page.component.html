<main class="container">
  <div class="back-bar">
    <a class="btn-back" [routerLink]="'/admin/module'">
      ← Volver al Módulo de Administración
    </a>
  </div>

  <section class="grid">
    <article *ngFor="let m of submodules" class="card clickable-card">
      <div class="row1">
        <!-- ✅ Ícono dinámico -->
        <div class="icon-wrapper">
          <img
            [src]="'assets/icons/' + m.icon + '.png'"
            alt="{{ m.title }}"
            class="icon-img"
          />
        </div>

        <span class="badge" [class.ok]="m.status === 'available'">
          {{ m.status === 'available' ? 'Disponible' : 'En desarrollo' }}
        </span>
      </div>

      <h3 class="title">{{ m.title }}</h3>
      <p class="desc">{{ m.desc }}</p>

      <div class="features">
        <strong>Funciones principales:</strong>
        <ul>
          <li *ngFor="let b of m.bullets">{{ b }}</li>
        </ul>
      </div>

      <div class="actions">
        <a *ngFor="let link of m.links" class="btn" [routerLink]="link.route">
          {{ link.label }}
        </a>
      </div>
    </article>
  </section>
</main>
