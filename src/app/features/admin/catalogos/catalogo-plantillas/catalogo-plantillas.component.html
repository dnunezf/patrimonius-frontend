<div class="container">
  <h2>Gestión de Plantillas</h2>

  <div class="grid">
    <!-- Formulario de subida -->
    <form (ngSubmit)="upload()" #f="ngForm" class="panel">
      <h3>Nueva Plantilla (.doc/.docx)</h3>

      <label>Nombre</label>
      <input name="nombre" [(ngModel)]="form.nombre" required />

      <label>Versión</label>
      <input name="version" [(ngModel)]="form.version" required />

      <label>Descripción</label>
      <textarea name="descripcion" [(ngModel)]="form.descripcion"></textarea>

      <label>Archivo</label>
      <input type="file" (change)="onFile($event)" accept=".doc,.docx" />

      <div class="row">
        <button type="submit" class="primary">Subir Plantilla</button>
      </div>
    </form>

    <!-- Listado -->
    <div class="panel">
      <h3>Listado</h3>
      <div *ngIf="loading">Cargando…</div>
      <table *ngIf="!loading">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Versión</th>
          <th>Archivo</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let p of plantillas">
          <td>{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.version }}</td>
          <td>{{ p.ruta_archivo }}</td>
          <td class="actions">
            <button (click)="rename(p)">Renombrar</button>
            <button (click)="remove(p.id)">Eliminar</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
