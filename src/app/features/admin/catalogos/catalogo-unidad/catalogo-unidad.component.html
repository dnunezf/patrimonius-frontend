<div class="container">
  <h2>Gestión de Unidades Organizacionales</h2>

  <div class="grid">
    <!-- Formulario de creación/edición -->
    <form (ngSubmit)="submit()" #f="ngForm" class="panel">
      <h3>{{ editing ? 'Editar Unidad' : 'Nueva Unidad' }}</h3>

      <label>Nombre</label>
      <input name="nombre" [(ngModel)]="form.nombre" required />

      <label>Descripción</label>
      <textarea name="descripcion" [(ngModel)]="form.descripcion"></textarea>

      <!-- Mostrar el mensaje de error -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="row">
        <button type="submit" class="primary">
          {{ editing ? 'Guardar cambios' : 'Crear Unidad' }}
        </button>
        <button type="button" (click)="cancel()" *ngIf="editing">
          Cancelar
        </button>
      </div>
    </form>

    <!-- Listado -->
    <div class="panel">
      <h3>Listado</h3>
      <div *ngIf="loading">Cargando…</div>
      <table *ngIf="!loading">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let u of unidades">
          <td>{{ u.id }}</td>
          <td>{{ u.nombre }}</td>
          <td>{{ u.descripcion || '—' }}</td>
          <td class="actions">
            <button (click)="edit(u)">Editar</button>
            <button (click)="remove(u.id)">Eliminar</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
