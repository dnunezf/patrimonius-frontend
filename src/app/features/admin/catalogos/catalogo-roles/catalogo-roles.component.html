<div class="container">
  <h1 class="page-title">Gestión de Catálogo de Roles</h1>

  <!-- Formulario para crear un rol -->
  <div class="form-container">
    <h2>{{ editing ? 'Editar Rol' : 'Crear Nuevo Rol' }}</h2>
    <form (ngSubmit)="submit()">
      <div>
        <label for="nombre">Nombre</label>
        <input id="nombre" [(ngModel)]="form.nombre" name="nombre" required placeholder="Nombre del rol" />
      </div>

      <div>
        <label for="descripcion">Descripción</label>
        <input id="descripcion" [(ngModel)]="form.descripcion" name="descripcion" placeholder="Descripción del rol" />
      </div>

      <button type="submit" [disabled]="loading || !form.nombre?.trim()">
        {{ editing ? 'Actualizar Rol' : 'Crear Rol' }}
      </button>
      <button type="button" (click)="cancel()">Cancelar</button>
    </form>
  </div>

  <!-- Mostrar lista de roles -->
  <div *ngIf="loading">Cargando...</div>

  <!-- Tabla de roles -->
  <table class="table" *ngIf="roles$ | async as roles; else vacio">
    <thead>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let rol of roles">
      <td>{{ rol.nombre }}</td>
      <td>{{ rol.descripcion || '—' }}</td>
      <td>
        <button class="edit" (click)="edit(rol)">Editar</button>
        <button class="delete" (click)="remove(rol.id)">Eliminar</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Mensaje si no hay roles -->
  <ng-template #vacio>
    <div class="empty">No hay roles.</div>
  </ng-template>
</div>
