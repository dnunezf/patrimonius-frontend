<div class="container">
  <h2>Gestión de Roles</h2>

  <div class="grid">
    <form (ngSubmit)="submit()" #f="ngForm" class="panel">
      <h3>{{ editing ? 'Editar Rol' : 'Nuevo Rol' }}</h3>

      <label>Nombre</label>
      <input name="nombre" [(ngModel)]="form.nombre" required />

      <label>Descripción</label>
      <textarea name="descripcion" [(ngModel)]="form.descripcion"></textarea>

      <div class="row">
        <button type="submit" class="primary">{{ editing ? 'Guardar' : 'Crear' }}</button>
        <button type="button" (click)="cancel()" *ngIf="editing">Cancelar</button>
      </div>
    </form>

    <div class="panel">
      <h3>Listado</h3>
      <div *ngIf="loading">Cargando…</div>
      <table *ngIf="!loading">
        <thead>
        <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th></th></tr>
        </thead>
        <tbody>
        <tr *ngFor="let r of roles">
          <td>{{ r.id }}</td>
          <td>{{ r.nombre }}</td>
          <td>{{ r.descripcion || '—' }}</td>
          <td class="actions">
            <button (click)="edit(r)">Editar</button>
            <button (click)="remove(r.id)">Eliminar</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
