<div class="back-bar">
  <a class="btn-back" routerLink="/admin/module/catalogs">← Volver a Catálogos</a>
</div>

<h2>Gestión de Catálogo de Roles</h2>

<div class="panel">
  <h3>{{ editing ? 'Editar Rol' : 'Crear Nuevo Rol' }}</h3>

  <label>Nombre</label>
  <input [(ngModel)]="form.nombreRol" placeholder="Nombre del rol" />

  <label>Descripción</label>
  <input [(ngModel)]="form.descripcion" placeholder="Descripción del rol" />

  <div class="row">
    <button class="primary" (click)="submit()" [disabled]="saving || !form.nombreRol">
      {{ editing ? 'Guardar Cambios' : 'Crear Rol' }}
    </button>
    <button *ngIf="editing" type="button" (click)="cancel()">Cancelar</button>
  </div>

  <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
</div>

<div class="panel">
  <h3>Listado</h3>
  <table>
    <thead>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th style="width:140px;">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let rol of (roles$ | async) ?? []; trackBy: trackById">
      <td>{{ rol.nombreRol }}</td>
      <td>{{ rol.descripcion || '—' }}</td>
      <td class="actions">
        <button (click)="edit(rol)">Editar</button>
        <button (click)="remove(rol)">Eliminar</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
