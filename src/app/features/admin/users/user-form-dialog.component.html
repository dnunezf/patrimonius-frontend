<!-- Modal/backdrop -->
<div *ngIf="open" class="modal" (click)="backdrop($event)">
  <!-- Dialog -->
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dlgTitle"
  >
    <button
      class="dialog__close"
      type="button"
      aria-label="Cerrar"
      (click)="close.emit()"
    >
      ×
    </button>

    <h2 id="dlgTitle" class="dialog__title">
      {{ editing ? "Editar Usuario" : "Crear Nuevo Usuario" }}
    </h2>
    <p class="dialog__subtitle">
      Complete la información para {{ editing ? "actualizar" : "crear" }} un
      usuario en el sistema
    </p>

    <form class="form" [formGroup]="form" (ngSubmit)="save()">
      <!-- ===== Personal information ===== -->
      <h3 class="section__title">Información Personal</h3>

      <div class="grid grid-2">
        <label class="form__label" for="nombre">Nombre *</label>
        <label class="form__label" for="apellido1">Primer apellido *</label>

        <div class="input with-icon">
          <span class="input__icon" aria-hidden="true">
            <img src="assets/icons/user.png" alt="" />
          </span>
          <input
            id="nombre"
            class="input__control"
            type="text"
            placeholder="Nombre del usuario"
            formControlName="nombre"
          />
        </div>

        <div class="input with-icon">
          <span class="input__icon" aria-hidden="true">
            <img src="assets/icons/user.png" alt="" />
          </span>
          <input
            id="apellido1"
            class="input__control"
            type="text"
            placeholder="Primer apellido"
            formControlName="apellido1"
          />
        </div>
      </div>

      <label class="form__label" for="apellido2"
        >Segundo apellido (opcional)</label
      >
      <div class="input with-icon">
        <span class="input__icon" aria-hidden="true">
          <img src="assets/icons/user.png" alt="" />
        </span>
        <input
          id="apellido2"
          class="input__control"
          type="text"
          placeholder="Segundo apellido"
          formControlName="apellido2"
        />
      </div>

      <label class="form__label" for="email">Correo electrónico *</label>
      <div class="input with-icon">
        <span class="input__icon" aria-hidden="true">
          <img src="assets/icons/email.png" alt="" />
        </span>
        <input
          id="email"
          class="input__control"
          type="email"
          placeholder="usuario@museocr.go.cr"
          autocomplete="username"
          formControlName="email"
        />
      </div>

      <!-- ===== Organization information ===== -->
      <h3 class="section__title">Información Organizacional</h3>

      <label class="form__label" for="rolId">Rol en el sistema *</label>
      <div class="select">
        <select id="rolId" class="select__control" formControlName="rolId">
          <option *ngFor="let r of ROLES" [ngValue]="r.id">
            {{ r.label }}
          </option>
        </select>
      </div>

      <label class="form__label" for="unidadId">Unidad organizacional *</label>
      <div class="select">
        <select
          id="unidadId"
          class="select__control"
          formControlName="unidadId"
        >
          <option *ngFor="let u of UNIDADES" [ngValue]="u.id">
            {{ u.label }}
          </option>
        </select>
      </div>

      <!-- Editor permissions -->
      <div *ngIf="isEditor()" class="editor-perms" aria-labelledby="permTitle">
        <div id="permTitle" class="perm-title">Permisos del Editor</div>
        <label class="switch" for="permEdit">
          <input id="permEdit" type="checkbox" formControlName="edit" />
          <span>Edición</span>
        </label>
        <label class="switch" for="permSign">
          <input id="permSign" type="checkbox" formControlName="sign" />
          <span>Firma</span>
        </label>
      </div>

      <!-- Notes (UI only, optional) -->
      <label class="form__label" for="notes">Notas adicionales</label>
      <textarea
        id="notes"
        class="textarea"
        rows="3"
        placeholder="Información adicional sobre el usuario (opcional)"
      ></textarea>

      <!-- Footer actions -->
      <div class="footer">
        <button class="btn btn--success" type="submit">
          {{ editing ? "Guardar Cambios" : "Crear Usuario" }}
        </button>
        <button class="btn btn--ghost" type="button" (click)="close.emit()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
