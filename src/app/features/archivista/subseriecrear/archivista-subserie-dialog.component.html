<div class="dialog-container">
  <h2>Crear Nueva Subserie</h2>

  <form (ngSubmit)="crearSubserie()">
    <div class="form-group">
      <label for="codigo">Código *</label>
      <input
        type="text"
        id="codigo"
        [(ngModel)]="codigo"
        name="codigo"
        required
        (input)="onCodigoInput()"
      />
    </div>

    <div class="form-group">
      <label for="nombre">Subserie *</label>
      <input
        type="text"
        id="nombre"
        [(ngModel)]="nombre"
        name="nombre"
        required
        (input)="onNombreInput()"
      />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        [(ngModel)]="descripcion"
        name="descripcion"
        (input)="onDescripcionInput()"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="serie">Serie *</label>
      <select
        id="serie"
        [(ngModel)]="serie_id"
        name="serie"
        required
      >
        <option [ngValue]="0" disabled>Seleccione una serie</option>
        <option *ngFor="let serie of series" [ngValue]="serie.id">
          {{ serie.nombre }}
        </option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn--primary">Crear</button>
      <button type="button" class="btn btn--secondary" (click)="cancelar()">
        Cancelar
      </button>
    </div>
  </form>
</div>
