<header class="dashboard-header">
  <h1>Panel principal</h1>

  <p class="dashboard-subtitle" *ngIf="visibleCards.length === 1">
    Acceso disponible según sus permisos
  </p>

  <p class="dashboard-subtitle" *ngIf="visibleCards.length > 1">
    Seleccione una opción para continuar
  </p>
</header>

<section class="roles" [class.single]="visibleCards.length === 1">

  <article *ngFor="let c of visibleCards"
           class="role-card"
           [ngClass]="c.cssClass"
           role="button"
           tabindex="0"
           (click)="goToCard(c)"
           (keydown.enter)="goToCard(c)"
           (keydown.space)="goToCard(c)">

    <img [src]="c.icon" alt="" aria-hidden="true" />
    <h3>{{ c.title }}</h3>
    <p>{{ c.subtitle }}</p>

    <div class="divider"></div>

    <ul>
      <li *ngFor="let b of c.bullets">{{ b }}</li>
    </ul>

  </article>

</section>
