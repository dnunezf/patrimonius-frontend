<!-- src/app/core/features/editor/document/metadata/document-metadata-dialog.component.html -->
<div class="md-backdrop" *ngIf="open" (click)="close()"></div>

<div
  class="md-modal"
  *ngIf="open"
  role="dialog"
  aria-modal="true"
  aria-labelledby="mdTitle"
>
  <header class="md-header">
    <h3 id="mdTitle">Metadatos del Documento</h3>
    <button
      type="button"
      class="md-close"
      (click)="close()"
      aria-label="Cerrar"
    >
      ×
    </button>
  </header>

  <section class="md-body">
    <div *ngIf="loading" class="md-info">Cargando…</div>
    <div *ngIf="!loading && error" class="md-error">{{ error }}</div>

    <ng-container *ngIf="!loading && !error">
      <!-- Automatic (read-only) -->
      <h4 class="md-subtitle">Información Automática (solo lectura)</h4>
      <div class="grid-2">
        <div class="ro-field">
          <label>Tipo (MIME)</label>
          <input
            class="ro"
            [value]="meta?.technical?.mimeType ?? '—'"
            readonly
          />
        </div>
        <div class="ro-field">
          <label>Tamaño</label>
          <input class="ro" [value]="sizeHuman()" readonly />
        </div>
        <div class="ro-field">
          <label>Fecha de creación</label>
          <input
            class="ro"
            [value]="formatDate(meta?.technical?.createdAt)"
            readonly
          />
        </div>
        <div class="ro-field">
          <label>Actualizado el</label>
          <input
            class="ro"
            [value]="formatDate(meta?.technical?.updatedAt)"
            readonly
          />
        </div>
        <div class="ro-field">
          <label>Nivel de acceso</label>
          <input
            class="ro"
            [value]="meta?.technical?.accessLevel ?? '—'"
            readonly
          />
        </div>
        <div class="ro-field">
          <label>Software</label>
          <input
            class="ro"
            [value]="meta?.technical?.software ?? '—'"
            readonly
          />
        </div>
      </div>

      <div class="grid-2 mt-24">
        <div class="ro-field">
          <label>Autor</label>
          <input
            class="ro"
            [value]="meta?.descriptive?.author ?? '—'"
            readonly
          />
        </div>
        <div class="ro-field">
          <label>Unidad responsable (ID)</label>
          <input
            class="ro"
            [value]="meta?.descriptive?.responsibleUnitId ?? '—'"
            readonly
          />
        </div>
      </div>

      <div class="form-field">
        <label>Código de documento</label>
        <input
          class="ro"
          [value]="meta?.technical?.documentCode ?? '—'"
          readonly
        />
      </div>

      <!-- Manual (editable) -->
      <h4 class="md-subtitle mt-24">Información Manual (editable)</h4>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-field">
          <label>Título del documento <span class="req">*</span></label>
          <input formControlName="title" placeholder="Título…" />
          <small class="err" *ngIf="f['title'].touched && f['title'].invalid"
            >Obligatorio. Máx. 255.</small
          >
        </div>

        <div class="form-field">
          <label
            >Palabras clave (separadas por coma)
            <span class="req">*</span></label
          >
          <input
            formControlName="keywords"
            placeholder="p. ej., conservación, arqueología, cerámica"
          />
          <small class="hint">Al menos una, hasta 20.</small>
          <small
            class="err"
            *ngIf="f['keywords'].touched && f['keywords'].invalid"
            >Ingrese al menos una palabra clave.</small
          >
        </div>

        <div class="grid-2">
          <div class="form-field">
            <label>Código de clasificación <span class="req">*</span></label>
            <input
              formControlName="classificationCode"
              placeholder="p. ej., DAF-AC-2025-XXX"
            />
            <small
              class="err"
              *ngIf="
                f['classificationCode'].touched &&
                f['classificationCode'].invalid
              "
            >
              Obligatorio. Máx. 60.
            </small>
          </div>
        </div>

        <div class="form-field">
          <label>Clasificación preliminar <span class="req">*</span></label>
          <input
            formControlName="preliminaryClass"
            placeholder="p. ej., Técnica - Conservación"
          />
          <small
            class="err"
            *ngIf="
              f['preliminaryClass'].touched && f['preliminaryClass'].invalid
            "
            >Obligatorio.</small
          >
        </div>

        <div class="md-footer">
          <button type="button" class="btn btn--ghost" (click)="close()">
            Cancelar
          </button>
          <button type="submit" class="btn" [disabled]="saving || form.invalid">
            {{ saving ? "Guardando…" : "Guardar Metadatos" }}
          </button>
        </div>
      </form>
    </ng-container>
  </section>
</div>
