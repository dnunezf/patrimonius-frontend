<h2>Crear documento</h2>

<form (ngSubmit)="crear()" class="form">
  <label for="titulo">Título</label>
  <input id="titulo" name="titulo" [(ngModel)]="titulo" required />

  <div class="row">
    <label for="firma">Firmas requeridas</label>
    <input id="firma" name="firma" type="number" min="0" [(ngModel)]="numero_firmas" />
  </div>

  <button type="submit" [disabled]="loading">Crear y editar</button>
  <span *ngIf="loading" class="loading">creando…</span>

  <div *ngIf="error" class="err">{{ error }}</div>
</form>
