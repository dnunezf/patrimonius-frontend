<div class="editor-grid">
  <div class="editor-main">
    <div class="top-bar">
      <button class="btn-back" (click)="goBack()">← Volver al Dashboard</button>
    </div>

    <div class="toolbar">
      <h2>Editor Colaborativo</h2>

      <div class="buttons">
        <label class="btn-primary">
          Importar DOCX
          <input type="file" accept=".docx" (change)="importDocx($event)" />
        </label>

        <button class="btn-save" (click)="save()" [disabled]="saving">
          Guardar
        </button>
      </div>
    </div>

    <!-- 📝 CONTENIDO DEL DOCUMENTO -->
    <div class="section">
      <div #editor class="quill-host"></div>
    </div>
  </div>

  <!-- ===== COLUMNA DERECHA ===== -->
  <div class="editor-sidebar">
    <div class="card">
      <h4>
        <img src="assets/icons/activeUser.png" width="18" />
        Editores Activos
      </h4>
      <div *ngIf="presence?.length; else noUsers" class="user-list">
        <div *ngFor="let u of presence" class="user-card">
          <div class="avatar">{{ (u.nombre?.[0] ?? '?') | uppercase }}</div>
          <b>{{ u.nombre }}</b>
        </div>
      </div>
      <ng-template #noUsers><small>No hay editores activos</small></ng-template>
    </div>

    <div class="card notif-card">
      <h4>
        <img src="assets/icons/comentario.png" width="18" />
        Comentarios
        <span *ngIf="unreadCount > 0" class="notif-badge">+{{ unreadCount }}</span>
      </h4>
      <button class="btn-outline" (click)="toggleComentarios()">Ver Anotaciones</button>
    </div>
  </div>

  <app-comment-panel
    [open]="showComentarios"
    [comentarios]="comentarios"
    [presence]="presence"
    (add)="addComentario($event)"
    (resolve)="markResolved($event)"
    (close)="toggleComentarios()"
  ></app-comment-panel>
</div>
