<div class="logs-container">
  <!-- Title and Description Section -->
  <section class="header-section">
    <button class="back-button" routerLink="/admin/dashboard"> ←  Volver</button>
    <h2>Consultas de Bitácoras</h2>
    <p>Seleccione el tipo de bitácora que desea consultar para auditoría del sistema.</p>
  </section>

  <!-- Log Cards Section -->
  <div class="logs-cards">
    <a
      class="log-card"
      *ngFor="let log of bitacoras"
      [routerLink]="log.link"
      [class.is-disabled]="!log.link"
      tabindex="0"
      role="button"
    >
      <div class="log-card__icon">
        <img [src]="getIconPath(log.icon)" alt="{{ log.title }}" />
      </div>

      <div class="log-card__info">
        <h3>{{ log.title }}</h3>
        <p>{{ log.description }}</p>

        <div class="log-card__details">
          <strong>Funciones principales:</strong>
          <ul>
            <li *ngFor="let fn of log.funciones">{{ fn }}</li>
          </ul>
        </div>
      </div>
    </a>
  </div>
</div>
